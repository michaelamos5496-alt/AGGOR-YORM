    <style>
/* Archive — same lavender stage, type and glass as the homepage */
:root {
    --ay-bg: #F8EEFF;
    --ay-purple: #7028F5;
    --ay-violet: #8F46F5;
    --ay-ink: #08070B;
    --ay-muted: #716A7B;
    --font-display: 'Inter Tight', 'Montserrat', sans-serif;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    --pad: clamp(1.25rem, 6vw, 6rem);
    --leaf: clamp(2.5rem, 6vw, 6rem) 1.25rem clamp(2.5rem, 6vw, 6rem) 1.25rem;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { background: var(--ay-bg); }

body {
    background:
        radial-gradient(50% 40% at 78% 18%, #EBD7FF 0%, rgba(235, 215, 255, 0) 70%),
        radial-gradient(35% 30% at 5% 5%, #FFFFFF 0%, rgba(255, 255, 255, 0) 70%),
        var(--ay-bg);
    color: var(--ay-ink);
    font-family: var(--font-display);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

body.modal-open { overflow: hidden; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

/* Frosted glass, as on the homepage pills */
.glass {
    border: 1px solid rgba(255, 255, 255, 0.65);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.4));
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 18px 40px -18px rgba(70, 20, 150, 0.45);
}

/* ── Top bar ── */
.topbar {
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(1rem, 3svh, 1.6rem) clamp(1.25rem, 5vw, 4.5rem);
    pointer-events: none;
}

.topbar > * { pointer-events: auto; }

.brand {
    font-size: clamp(1.2rem, 1.9vw, 1.8rem);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
}

.brand sup { font-size: 0.5em; font-weight: 500; margin-left: 2px; vertical-align: 0.9em; }

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.75rem 1.4rem 0.75rem 1.1rem;
    border-radius: 999px;
    transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
}

.back-link:hover { background: var(--ay-ink); color: #FFFFFF; }

/* ── Featured film ── */
.hero {
    display: grid;
    grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
    align-items: center;
    gap: clamp(2rem, 5vw, 5rem);
    padding: clamp(7rem, 14svh, 9rem) var(--pad) clamp(3rem, 6vw, 5rem);
}

.eyebrow {
    font-size: clamp(0.66rem, 0.85vw, 0.8rem);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ay-purple);
    margin-bottom: clamp(0.8rem, 2svh, 1.4rem);
}

.hero-content h1 {
    font-size: clamp(3.2rem, 8.4vw, 9rem);
    font-weight: 900;
    line-height: 0.84;
    letter-spacing: -0.06em;
    text-transform: uppercase;
    margin: 0 0 0 -0.045em;
}

.hero-content h1 span { display: block; }
.hero-content h1 .accent { color: var(--ay-purple); }

.lede {
    font-size: clamp(1.05rem, 1.5vw, 1.4rem);
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: var(--ay-muted);
    max-width: 24rem;
    margin: clamp(1.2rem, 3svh, 1.8rem) 0 clamp(1.5rem, 4svh, 2.4rem);
}

.play-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.5rem 1.6rem 0.5rem 0.5rem;
    border: 0;
    border-radius: 999px;
    background: var(--ay-ink);
    color: #FFFFFF;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    cursor: pointer;
    transition: background-color 0.3s var(--ease), translate 0.3s var(--ease);
}

.play-btn i {
    display: grid;
    place-items: center;
    width: 2.8rem;
    height: 2.8rem;
    border-radius: 50%;
    background: var(--ay-purple);
}

.play-btn:hover { background: var(--ay-purple); translate: 0 -2px; }
.play-btn:hover i { background: var(--ay-ink); }

.play-btn svg {
    width: 0.85rem;
    height: 0.85rem;
    fill: currentColor;
    margin-left: 2px;
}

.feature {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: var(--leaf);
    overflow: hidden;
    background: #1A1622;
    box-shadow: 0 50px 90px -45px rgba(80, 30, 160, 0.6);
}

.feature-wrap { position: relative; }

.feature-ring {
    position: absolute;
    inset: -1.1rem -1.1rem 1.1rem 1.1rem;
    border: 1.5px solid rgba(112, 40, 245, 0.3);
    border-radius: var(--leaf);
    pointer-events: none;
}

.feature img,
.feature iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    object-fit: cover;
}

.feature iframe {
    transform: scale(1.15); /* hides the player's letterbox edges */
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s var(--ease);
}

.feature iframe.is-ready { opacity: 1; }

/* ── Shelves ── */
main {
    padding-bottom: clamp(4rem, 8vw, 6rem);
}

.shelf-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    padding: 0 var(--pad);
    margin-bottom: 0.5rem;
}

.shelf h2 {
    font-size: clamp(2rem, 4.4vw, 4.2rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.055em;
    text-transform: uppercase;
}

.shelf h2 span { color: var(--ay-purple); }

.shelf-hint {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ay-muted);
}

.row {
    display: flex;
    gap: clamp(0.9rem, 1.6vw, 1.5rem);
    overflow-x: auto;
    padding: 2rem var(--pad) 3.5rem; /* room for the hover lift + shadow */
    scroll-snap-type: x proximity;
    scroll-padding: 0 var(--pad);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}

.row::-webkit-scrollbar { display: none; }

.card {
    position: relative;
    flex: 0 0 auto;
    border: 0;
    padding: 0;
    border-radius: var(--leaf);
    overflow: hidden;
    background: #1A1622;
    cursor: pointer;
    scroll-snap-align: start;
    box-shadow: 0 30px 60px -38px rgba(80, 30, 160, 0.7);
    transition: translate 0.45s var(--ease), box-shadow 0.45s var(--ease);
    outline: none;
}

.card.film {
    width: clamp(17rem, 34vw, 31rem);
    aspect-ratio: 16 / 9;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.8s var(--ease);
}

.card .badge {
    position: absolute;
    right: 0.9rem;
    bottom: 0.9rem;
    width: 2.8rem;
    height: 2.8rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--ay-purple);
    transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
}

.card .badge svg {
    width: 0.85rem;
    height: 0.85rem;
    fill: currentColor;
    margin-left: 2px;
}

.card:hover,
.card:focus-visible {
    translate: 0 -6px;
    box-shadow: 0 40px 70px -36px rgba(112, 40, 245, 0.85), 0 0 0 2px var(--ay-purple);
}

.card:hover img { transform: scale(1.05); }
.card:hover .badge { background: var(--ay-purple); color: #FFFFFF; }

.back-link:focus-visible,
.play-btn:focus-visible { outline: 2px solid var(--ay-purple); outline-offset: 4px; }

/* ── Modal (film player) ── */
.modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(11, 7, 20, 0.92);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    padding: clamp(0.75rem, 4vw, 3rem);
}

.modal.open {
    display: flex;
    animation: fade 0.35s var(--ease);
}

@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-stage {
    width: min(100%, 1280px);
    max-height: 100%;
    display: grid;
    place-items: center;
}

.modal-stage iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 1.25rem;
    background: #000;
}

.modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 3rem;
    height: 3rem;
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.3s var(--ease), color 0.3s var(--ease);
}

.modal-close:hover { background: #FFFFFF; color: var(--ay-purple); }

footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 2rem;
    padding: 1.75rem clamp(1.25rem, 5vw, 4.5rem);
    background: var(--ay-ink);
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.8rem;
}

footer .brand { color: #FFFFFF; font-size: 1.3rem; }
footer a { color: #FFFFFF; transition: color 0.3s var(--ease); }
footer p a:hover { color: #CBA8FF; }

@media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding-top: clamp(6rem, 22vw, 8rem); }
    .hero-content h1 { font-size: clamp(3.2rem, 18vw, 8rem); }
    .feature-wrap { margin-left: 1rem; }
}

@media (max-width: 640px) {
    footer { flex-direction: column; text-align: center; }
    .shelf-hint { display: none; }
}

@media (hover: none) {
    .card:hover { translate: none; box-shadow: 0 30px 60px -38px rgba(80, 30, 160, 0.7); }
    .card:hover img { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
    .card,
    .card img,
    .play-btn,
    .feature iframe {
        transition: none;
    }

    .modal.open { animation: none; }
}
    </style>
</head>

<body>

        <a class="back-link glass" href="index.html#work">&larr; Back to Selected Works</a>
    </header>

    <section class="hero" id="hero">

            <button class="play-btn" type="button" data-video="1135942055?h=cafced5ff7">

    </div>

    <script>
(function () {
    const modal = document.getElementById('modal');
    const stage = document.getElementById('modal-stage');
    const closeBtn = document.getElementById('modal-close');
    let lastFocus = null;

    function open(node) {
        lastFocus = document.activeElement;
        stage.replaceChildren(node);
        modal.classList.add('open');
        document.body.classList.add('modal-open');
        closeBtn.focus();
    }

    function close() {
        modal.classList.remove('open');
        document.body.classList.remove('modal-open');
        stage.replaceChildren(); // removing the iframe stops playback
        if (lastFocus) lastFocus.focus();
    }

    document.addEventListener('click', (e) => {
        const video = e.target.closest('[data-video]');
        const yt = e.target.closest('[data-youtube]');
        if (yt) {
            const frame = document.createElement('iframe');
            frame.src = 'https://www.youtube-nocookie.com/embed/' + yt.dataset.youtube + '?autoplay=1&rel=0&modestbranding=1';
            frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
            frame.setAttribute('allowfullscreen', '');
            frame.title = 'Film player';
            open(frame);
        } else if (video) {
            const [id, query] = video.dataset.video.split('?');
            const frame = document.createElement('iframe');
            frame.src = 'https://player.vimeo.com/video/' + id + '?' + (query ? query + '&' : '') + 'autoplay=1&title=0&byline=0&portrait=0';
            frame.allow = 'autoplay; fullscreen; picture-in-picture';
            frame.setAttribute('allowfullscreen', '');
            frame.title = 'Film player';
            open(frame);
        } else if (e.target === modal || e.target === stage) {
            close();
        }
    });

    closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) close();
    });

    // Featured film: ambient muted preview fades in over the poster (desktop only)
    const frame = document.getElementById('hero-frame');
    if (frame && !window.matchMedia('(hover: none)').matches &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // Vimeo shows a spinner until playback starts; keep the poster visible meanwhile
        frame.addEventListener('load', () => setTimeout(() => frame.classList.add('is-ready'), 2500), { once: true });
        frame.src = frame.dataset.src;
    }
})();
    </script>
